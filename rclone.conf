[jira_backup]
type = sftp
host = remote_backup_server_ip
user = backupuser
port = 22
key_file = /home/jira/.ssh/id_ed25519

# Команды для проверки контрольных сумм
md5sum_command = md5sum
sha1sum_command = sha1sum

# Таймауты
connect_timeout = 30s
timeout = 5m

# Безопасность
ask_password = false
set_modtime = true

# Оптимизация для множества мелких файлов
skip_links = true
dir_cache_time = 5m
fast_list = true